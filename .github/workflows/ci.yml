name: CI

on:
  push:
    branches: [main, improvements]
  pull_request:
  workflow_dispatch:

jobs:
  data-tooling:
    name: Data tooling (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (offline)
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

  optimizer-crosscheck:
    name: Optimizer vs reference solver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the optimizer dump tool
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target axiom_optimizer_dump --parallel
      - name: Install reference solvers
        run: python3 -m pip install --quiet numpy cvxpy clarabel
      - name: Compare against cvxpy / Clarabel and closed forms
        run: python3 scripts/check_optimizer.py --binary build/bin/axiom_optimizer_dump --tol 1e-8

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            config: Release
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          - name: macOS (Apple Clang)
            os: macos-latest
            config: Release
            cmake_args: ""
          - name: Windows (MSVC)
            os: windows-latest
            config: Release
            cmake_args: ""
          - name: Linux (Clang, ASan + UBSan)
            os: ubuntu-latest
            config: Debug
            cmake_args: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DAXIOM_ENABLE_OPENMP=OFF
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
              "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: cmake --version

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure -V

      - name: CLI showcase (sample data)
        if: matrix.config == 'Release'
        shell: bash
        run: |
          BIN=build/bin/axiomquant
          if [ -f build/bin/${{ matrix.config }}/axiomquant.exe ]; then BIN=build/bin/${{ matrix.config }}/axiomquant.exe; fi
          mkdir -p cli-output
          "$BIN" --data sample_data --no-db --export-dir cli-output | tee cli-output.txt

      - name: CLI on generated and imported data
        if: matrix.name == 'Linux (GCC)'
        shell: bash
        run: |
          python3 scripts/fetch_data.py synthetic --out synth_data --tickers SPY QQQ IWM TLT GLD --seed 7
          ./build/bin/axiomquant --data synth_data --no-db --paths 500 > synth-output.txt
          # Round-trip through `import` as a long-format, Kaggle-style file with lower-case headers.
          python3 - <<'PY'
          import csv, pathlib
          with open("long.csv", "w", newline="") as out:
              w = csv.writer(out)
              w.writerow(["date", "open", "high", "low", "close", "volume", "Name"])
              for f in sorted(pathlib.Path("synth_data").glob("*.csv")):
                  for r in list(csv.reader(f.open()))[1:]:
                      w.writerow([r[0], r[1], r[2], r[3], r[4], r[6], f.stem])
          PY
          python3 scripts/fetch_data.py import long.csv --out imported_data
          diff -r synth_data imported_data && echo "import round-trip is byte-identical"
          ./build/bin/axiomquant --data imported_data --no-db --paths 500 > imported-output.txt

      - name: Upload CLI output
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: cli-output-${{ matrix.os }}
          path: |
            cli-output.txt
            cli-output/
