name: CI

on:
  push:
    branches: [main, improvements]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            config: Release
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          - name: macOS (Apple Clang)
            os: macos-latest
            config: Release
            cmake_args: ""
          - name: Windows (MSVC)
            os: windows-latest
            config: Release
            cmake_args: ""
          - name: Linux (Clang, ASan + UBSan)
            os: ubuntu-latest
            config: Debug
            cmake_args: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DAXIOM_ENABLE_OPENMP=OFF
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
              "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: cmake --version

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure -V

      - name: CLI showcase (sample data)
        if: matrix.config == 'Release'
        shell: bash
        run: |
          BIN=build/bin/axiomquant
          if [ -f build/bin/${{ matrix.config }}/axiomquant.exe ]; then BIN=build/bin/${{ matrix.config }}/axiomquant.exe; fi
          mkdir -p cli-output
          "$BIN" --data sample_data --no-db --export-dir cli-output | tee cli-output.txt

      - name: Upload CLI output
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: cli-output-${{ matrix.os }}
          path: |
            cli-output.txt
            cli-output/
